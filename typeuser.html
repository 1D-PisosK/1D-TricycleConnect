<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tricycle Connect</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- LOGO -->
        <div class="logo-area">

            <!-- Simple tricycle icon -->
            <div class="tricycle">
                <div class="roof"></div>
                <div class="body"></div>
                <div class="front"></div>
                <div class="wheel wheel-left"></div>
                <div class="wheel wheel-right"></div>
            </div>

            <h1>Tricycle</h1>
            <h2>Connect</h2>
        </div>


        <!-- USER LOGIN SELECTION -->
        <div class="login-box">

            <div class="login-title">
                <span>- Select type of user to log in</span>

                <!-- User icon -->
                <div class="user-icon">
                    <div class="head"></div>
                    <div class="shoulder"></div>
                </div>
            </div>


            <!-- OPTIONS -->
            <div class="options">

                <label class="option">
                    <span>Driver</span>

                    <input type="radio" name="userType" value="driver" checked>
                    <span class="radio"></span>
                </label>


                <label class="option">
                    <span>Passenger</span>

                    <input type="radio" name="userType" value="passenger">
                    <span class="radio"></span>
                </label>

            </div>

        </div>

    </div>

</body>
</html>
